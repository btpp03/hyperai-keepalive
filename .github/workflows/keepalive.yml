name: hyperai-keepalive

# 免费档实例单次最长跑 2 小时，到点必停。
# 每小时检查：已停 -> 拉起；接近 2h 上限 -> 主动重启；
# 恢复后把新节点链接直接推 Telegram（不落仓库）。
on:
  schedule:
    # 每 15 分钟一查。免费档 2h 硬砍机，15 分钟的粒度保证在 [100,120) 分钟内
    # 必有一次检查 -> 主动重启总能在被砍前触发，空窗 ≈ 1~3 分钟。
    # 公开仓 Actions 不限额，随便跑。
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "实例健康也强制 SSH 进去刷新一次链接并推送"
        type: boolean
        default: false

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install deps
        run: pip install --quiet paramiko

      - name: run keepalive
        env:
          TZ: Asia/Shanghai          # 日志时间戳走北京时间
          HYPERAI_TOKEN: ${{ secrets.HYPERAI_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_FETCH: ${{ inputs.force_fetch }}
        run: python keepalive.py

      # 持久化"下线中"标记, 保证同一段下线期只推一次提示 (恢复时删除)
      - name: persist down-state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .hyperai_down 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(hyperai): update down-state" || true
            git push || true
          else
            echo "down-state unchanged"
          fi
